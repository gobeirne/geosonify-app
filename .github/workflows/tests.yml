# Geosonify tests (WP2.9, Nov 2026): every push and pull request.
#   unit:    every Node test and frozen-format vector (tests/run-all.js)
#   browser: the app itself in headless Chromium (tests/smoke.py)
# Results: the repository's Actions tab; a red cross by a commit means a test failed.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-only packages (pinned; nothing is added to the site)
        run: npm install --no-save --no-package-lock jsdom@24.1.3 geojson-vt@3.2.1 vt-pbf@3.1.3 @mapbox/vector-tile@1.3.1 pbf@3.3.0 geographiclib-geodesic@2.2.0
      - name: Run all tests
        run: node tests/run-all.js
      - name: Python decoder (PyPI package) against the vectors
        run: python3 -m unittest discover -s packages/python/geosonify-decode/tests -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright and Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Smoke test in a browser
        run: python tests/smoke.py
