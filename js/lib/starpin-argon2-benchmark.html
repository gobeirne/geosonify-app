<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starpin — Argon2 speed test</title>
<!--
  A self-contained benchmark. Give this URL to someone with a budget Android
  (or run it on several phones). They tap one button, wait, and copy a result
  block to send back. That result tells us how heavy we can make Argon2id
  WITHOUT the unlock feeling slow on a cheap phone — and those params become
  permanent, so we measure on real hardware rather than guessing.

  It runs the SAME Argon2 (@noble/hashes) the app ships, times several candidate
  settings, runs each a few times and discards the first (cold WASM/JIT), and
  captures the device so one odd phone doesn't mislead us.

  Self-contained: only dependency is the noble Argon2 module from a CDN. Nothing
  is uploaded anywhere; the result is just text to copy and send.
-->
<style>
  body { font: 16px/1.55 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 1.2rem; }
  h1 { font-size: 1.3rem; }
  button { font: inherit; padding: .7rem 1.2rem; border-radius: 8px; border: 1px solid #2b6cb0;
    background: #2b6cb0; color: #fff; cursor: pointer; width: 100%; margin: .8rem 0; }
  button:disabled { opacity: .5; }
  .muted { color: #666; font-size: .9rem; }
  #progress { min-height: 1.4em; font-size: .95rem; color: #444; margin: .5rem 0; }
  #result { white-space: pre-wrap; background: #0b0b0c; color: #d6d6d6; padding: 1rem;
    border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    margin-top: 1rem; display: none; }
  .row { display: flex; gap: .5rem; }
  .copy { background: #444; border-color: #444; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; margin-top: .5rem; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid #eee; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .good { color: #237a3f; } .warn { color: #b0442b; }
</style>
</head>
<body>
<h1>Starpin — phone speed test 🐢</h1>
<p class="muted">This measures how fast this phone can do the “unlock” calculation
Starpin uses. It runs for about a minute and the phone may feel warm — that’s
normal. When it’s done, tap <strong>Copy result</strong> and send it back.</p>

<button id="go">Start the test</button>
<div id="progress"></div>
<table id="live" style="display:none"><thead>
  <tr><th>setting</th><th>memory</th><th>passes</th><th class="n">time</th></tr>
</thead><tbody></tbody></table>

<div id="result"></div>
<div class="row" style="display:none" id="copyrow">
  <button class="copy" id="copy">Copy result</button>
</div>

<script type="module">
import { argon2id } from 'https://esm.sh/@noble/hashes@1.8.0/argon2';

const $ = id => document.getElementById(id);
const enc = new TextEncoder();

// Candidate parameter sets to measure. We vary memory (KiB) and passes (t),
// p=1 throughout (WASM single-thread on phones). These bracket the realistic
// range: from light (fast, weaker) to RFC-9106-ish heavy (slower, stronger).
// dkLen 32 = what the app uses.
const CANDIDATES = [
  { label: 'light',       m: 8192,   t: 2 },   // 8 MiB
  { label: 'medium',      m: 19456,  t: 2 },   // 19 MiB (RFC 9106 "second" profile-ish)
  { label: 'heavy',       m: 46080,  t: 1 },   // 45 MiB
  { label: 'draft-guess', m: 65536,  t: 3 },   // 64 MiB, t=3 — the current design guess
  { label: 'very-heavy',  m: 65536,  t: 4 },   // 64 MiB, t=4
];
const REPS = 4;         // runs per candidate; we discard the first (cold) and take the median of the rest

function fmtMem(kib) { return kib >= 1024 ? (kib/1024).toFixed(0) + ' MiB' : kib + ' KiB'; }
function median(a) { const s = a.slice().sort((x,y)=>x-y); const m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; }

async function timeOne(params) {
  const pw = enc.encode('benchmark-password-of-typical-length');
  const salt = enc.encode('benchmark-salt-16b!');
  const times = [];
  for (let i = 0; i < REPS; i++) {
    const t0 = performance.now();
    // eslint-disable-next-line no-await-in-loop
    argon2id(pw, salt, { t: params.t, m: params.m, p: 1, dkLen: 32 });
    const dt = performance.now() - t0;
    times.push(dt);
    await new Promise(r => setTimeout(r, 30));   // let the UI breathe
  }
  // discard the first (cold compile/JIT), median of the rest
  return { all: times, ms: Math.round(median(times.slice(1))) };
}

function deviceInfo() {
  const n = navigator;
  return {
    ua: n.userAgent,
    mem: n.deviceMemory || 'unknown',       // GiB, coarse
    cores: n.hardwareConcurrency || 'unknown',
    dpr: window.devicePixelRatio || 1,
    screen: window.screen ? (window.screen.width + 'x' + window.screen.height) : 'unknown',
    lang: n.language || ''
  };
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  $('live').style.display = 'table';
  const tbody = $('live').querySelector('tbody');
  const results = [];

  // warm up the WASM module once so the first real measurement isn't the compile
  $('progress').textContent = 'warming up…';
  try { argon2id(enc.encode('x'), enc.encode('yyyyyyyyyyyyyyyy'), { t: 1, m: 1024, p: 1, dkLen: 32 }); } catch (e) {}

  for (let i = 0; i < CANDIDATES.length; i++) {
    const c = CANDIDATES[i];
    $('progress').textContent = `testing ${i+1} of ${CANDIDATES.length}: ${c.label} (${fmtMem(c.m)}, ${c.t} pass${c.t>1?'es':''})…`;
    const row = document.createElement('tr');
    row.innerHTML = `<td>${c.label}</td><td>${fmtMem(c.m)}</td><td>${c.t}</td><td class="n">…</td>`;
    tbody.appendChild(row);
    let r;
    try { r = await timeOne(c); }
    catch (e) { r = { ms: -1, error: String(e && e.message || e) }; }
    results.push({ ...c, ...r });
    const cell = row.lastElementChild;
    if (r.ms < 0) { cell.textContent = 'failed'; cell.className = 'n warn'; }
    else {
      cell.textContent = r.ms + ' ms';
      cell.className = 'n ' + (r.ms <= 1500 ? 'good' : 'warn');
    }
  }

  $('progress').textContent = 'done — please copy the result below and send it back.';

  const payload = {
    starpin_argon2_benchmark: 1,
    when: new Date().toISOString(),
    device: deviceInfo(),
    reps: REPS,
    note: 'median of runs 2..N (first discarded as cold). p=1, dkLen=32.',
    results: results.map(r => ({ label: r.label, m_kib: r.m, t: r.t, ms: r.ms, raw_ms: r.all || null, error: r.error || null }))
  };
  const text = JSON.stringify(payload, null, 2);
  $('result').textContent = text;
  $('result').style.display = 'block';
  $('copyrow').style.display = 'flex';
  $('copy').addEventListener('click', () => {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.resolve())
      .then(() => { $('copy').textContent = 'Copied ✓ — now paste it into a message'; })
      .catch(() => { $('copy').textContent = 'Select the text above and copy it manually'; });
  });
  $('go').textContent = 'Run again';
  $('go').disabled = false;
});
</script>
</body>
</html>
